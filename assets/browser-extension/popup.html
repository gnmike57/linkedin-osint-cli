<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 262px; padding: 12px; margin: 0; }
      h3 { margin: 0 0 8px; }
      button { width: 100%; padding: 8px; cursor: pointer; }
      p { color: #555; margin: 8px 0 0; }
      code { background: #f2f2f2; padding: 0 3px; }
      input[type="number"] { width: 62px; }
      .row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
      .muted { color: #777; font-size: 12px; }
      #st { min-height: 16px; }
    </style>
  </head>
  <body>
    <h3>LinkedIn OSINT CLI</h3>
    <button id="cap">Send session to CLI</button>
    <p id="st">Run <code>linkedin extension listen</code> first.</p>

    <button id="qid" style="margin-top:6px">Refresh people-search queryId</button>
    <p id="qst" class="muted">Learns the current queryId via a hidden tab.</p>

    <div class="row">
      <label for="every">Auto-send every</label>
      <input id="every" type="number" min="30" step="5" />
      <span class="muted">seconds</span>
      <button id="save" style="width:auto;padding:4px 8px">Save</button>
    </div>
    <p id="auto" class="muted">Auto-send: &mdash;</p>
    <script src="popup.js"></script>
  </body>
</html>
