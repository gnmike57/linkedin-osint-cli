name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22]
        include:
          # Cross-platform check: the CLI has Windows-specific path and
          # filename handling, and the console smoke test drives stdin.
          - os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # @inquirer/prompts is optional: installs continue if the registry
      # cannot serve it, and the console falls back to node:readline.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test — MCP server
        run: npm run smoke:mcp

      - name: Smoke test — interactive console
        run: npm run smoke:menu
